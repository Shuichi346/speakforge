[project]
name = "speakforge"
version = "0.1.0"
description = "英語スピーキング練習アプリ - 口頭英作文と独り言英会話で瞬発力と表現力を鍛える"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["english", "speaking", "practice", "whisper", "gradio", "llm"]

dependencies = [
    "gradio>=5.0.0",
    "pywhispercpp>=1.4.0",
    "openai>=1.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pocket-tts>=0.1.0",
    "scipy>=1.11.0",
]

[project.scripts]
speakforge = "speakforge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakforge"]

# 開発用依存関係（PEP 735準拠の新形式）
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["speakforge"]
